---
layout: default
title: Categories
---

<header>
  <h2 class="h2 article-title">Categories</h2>
</header>

<section class="about-text">
  <p>Click a category to view all posts filed under it.</p>
</section>

<div class="tag-cloud">
{% assign all_cats = site.categories | sort %}
{% for cat in all_cats %}
  <a class="tag-pill tag-lg" href="/category/#{{ cat[0] | slugify }}">{{ cat[0] }} &middot; {{ cat[1].size }}</a>
{% endfor %}
</div>
