<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#2457e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;750&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232457e6'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='700' font-size='26' fill='%23ffffff' text-anchor='middle'%3EDR%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="header-row">
      <a class="header-brand" href="/">
        <span class="monogram" style="width:34px;height:34px;border-radius:10px;font-size:.8rem;">DR</span>
        <span>Debobroto Das Robin</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      {% include sidebar.html %}
    </aside>
    <main class="main-content{% if page.prose %} prose-page{% endif %}" id="main-content">
      {{ content }}
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-row">
      <span>&copy; {{ site.time | date: '%Y' }} Debobroto Das Robin</span>
      <span>Built with Jekyll &middot; Hosted on GitHub Pages</span>
    </div>
  </footer>

  <script>
    (function () {
      var toggle = document.getElementById('nav-toggle');
      var sidebar = document.getElementById('sidebar');
      if (!toggle || !sidebar) return;
      toggle.addEventListener('click', function () {
        var open = sidebar.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
</body>
</html>
